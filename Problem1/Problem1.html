<section id="addPage" class="page">
    <div class="card add-card">

        <div class="add-group">
            <div class="add-label">
                <span class="add-label-icon icon-description"></span>
                What did you spend on?
            </div>

            <input class="add-input"
                   type="text"
                   id="descripton"
                   placeholder="Example: Pizza and chicken"
        </div>

        <div class="add-group">
            <div class="add-label">
                <span class="add-label-icon icon-amount"></span>
                Enter amount
            </div>

            <input class="add-input"
                   type="text"
                   inputmode="numeric"
                   id="description"
                   placeholder="Example: 150000">
        </div>

        <button class="primary-btn add-btn"
                type="submit"
                onclick="addExpens()">
            Add expense
        </button>

    </div>
</section>
